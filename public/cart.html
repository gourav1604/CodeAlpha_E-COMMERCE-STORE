<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart & Checkout | CodeAlpha E-Commerce Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon-wrap">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        CODEALPHA <span>COMMERCE</span>
        <span class="logo-badge">Platform</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-compass"></i> Catalog</a></li>
          <li>
            <a href="cart.html" class="nav-link cart-icon-wrapper active">
              <i class="fa-solid fa-bag-shopping"></i> Cart
              <span id="cart-count" class="cart-badge" style="display: none;">0</span>
            </a>
          </li>
          <li id="nav-auth" class="nav-menu" style="gap: 12px;">
            <a href="login.html" class="nav-link"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Cart & Checkout Container -->
  <main class="container" style="margin-top: 36px; margin-bottom: 60px;">
    <div class="section-header">
      <h2><i class="fa-solid fa-bag-shopping"></i> Acquisition <span>Bag & Checkout</span></h2>
    </div>

    <div id="cart-view">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 <strong>CodeAlpha E-Commerce Platform</strong> &bull; Full Stack Internship &bull; Task 1</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    function renderCart() {
      const cartView = document.getElementById('cart-view');
      const items = Cart.getItems();
      const user = Auth.getUser();

      if (items.length === 0) {
        cartView.innerHTML = `
          <div class="empty-state" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 60px 24px; box-shadow: var(--shadow-card);">
            <i class="fa-solid fa-box-open empty-state-icon" style="color: var(--cyan-primary);"></i>
            <h2>Your Acquisition Bag is Empty</h2>
            <p>You have not selected any rare design pieces from our exhibition yet.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 24px;">
              <i class="fa-solid fa-compass"></i> Explore Exhibition
            </a>
          </div>
        `;
        return;
      }

      const subtotal = Cart.getTotal();
      const shipping = 0.00; // Free white-glove express courier
      const total = subtotal + shipping;

      cartView.innerHTML = `
        <div class="cart-layout">
          
          <!-- Items List Card -->
          <div class="cart-card">
            <h3 style="margin-bottom: 20px; font-size: 1.2rem; color: #fff; display: flex; align-items: center; gap: 8px;">
              <i class="fa-solid fa-list-check" style="color: var(--cyan-primary);"></i> Selected Pieces (${Cart.getCount()})
            </h3>
            <table class="cart-table">
              <thead>
                <tr>
                  <th>Artifact</th>
                  <th>Quantity</th>
                  <th>Subtotal</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(item => `
                  <tr>
                    <td>
                      <div class="cart-item-info">
                        <img src="${item.image_url}" alt="${item.name}" class="cart-item-img" onerror="this.src='https://images.unsplash.com/photo-1545454675-3531b543be5d?w=800'">
                        <div>
                          <a href="product.html?id=${item.id}" class="cart-item-title">${item.name}</a>
                          <div class="cart-item-price">${formatCurrency(item.price)} each</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <button class="qty-btn" style="width: 30px; height: 30px;" onclick="updateCartQty(${item.id}, ${item.quantity - 1})">-</button>
                        <span style="font-weight: 700; font-family: var(--font-mono); min-width: 24px; text-align: center;">${item.quantity}</span>
                        <button class="qty-btn" style="width: 30px; height: 30px;" onclick="updateCartQty(${item.id}, ${item.quantity + 1})">+</button>
                      </div>
                    </td>
                    <td style="font-weight: 700; font-family: var(--font-mono); color: #38bdf8;">
                      ${formatCurrency(item.price * item.quantity)}
                    </td>
                    <td>
                      <button onclick="removeCartItem(${item.id})" class="btn btn-danger btn-sm" title="Remove piece">
                        <i class="fa-solid fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <div style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <a href="index.html" class="btn btn-outline btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Return to Exhibition
              </a>
              <button onclick="handleClearCart()" class="btn btn-outline btn-sm" style="color: var(--rose-danger); border-color: rgba(244, 63, 94, 0.3);">
                <i class="fa-solid fa-trash"></i> Empty Bag
              </button>
            </div>
          </div>

          <!-- Order Summary & Checkout Form -->
          <div class="cart-card">
            <h3 style="margin-bottom: 20px; font-size: 1.2rem; color: #fff; display: flex; align-items: center; gap: 8px;">
              <i class="fa-solid fa-receipt" style="color: var(--cyan-primary);"></i> Acquisition Summary
            </h3>

            <div class="order-summary">
              <div class="summary-row">
                <span>Vault Items Subtotal</span>
                <span style="font-family: var(--font-mono);">${formatCurrency(subtotal)}</span>
              </div>
              <div class="summary-row">
                <span>Secured Express Courier</span>
                <span style="color: var(--emerald-success); font-weight: 600; font-family: var(--font-mono);">COMPLIMENTARY</span>
              </div>
              <div class="summary-row">
                <span>Studio Certification & Insurance</span>
                <span style="color: var(--emerald-success); font-weight: 600; font-family: var(--font-mono);">INCLUDED</span>
              </div>
              <div class="summary-row total">
                <span>Total Due</span>
                <span>${formatCurrency(total)}</span>
              </div>
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-subtle);">

            <h4 style="margin-bottom: 16px; font-size: 1rem; color: #fff;"><i class="fa-solid fa-truck-fast"></i> Delivery & Dispatch Details</h4>
            <form id="checkout-form" onsubmit="handlePlaceOrder(event)">
              <div class="form-group">
                <label for="cust-name">Full Name *</label>
                <input type="text" id="cust-name" class="form-control" placeholder="e.g. Alex Mercer" required value="${user ? user.name : ''}">
              </div>

              <div class="form-group">
                <label for="cust-email">Email Address *</label>
                <input type="email" id="cust-email" class="form-control" placeholder="alex@domain.com" required value="${user ? user.email : ''}">
              </div>

              <div class="form-group">
                <label for="cust-address">Delivery Destination *</label>
                <textarea id="cust-address" class="form-control" rows="3" placeholder="Suite, Street Address, City, State, Postal PIN Code" required></textarea>
              </div>

              <div class="form-group">
                <label for="cust-payment">Payment Method *</label>
                <select id="cust-payment" class="form-control" required>
                  <option value="Credit / Debit Card">Direct Card Settlement (Encrypted)</option>
                  <option value="UPI / Net Banking">UPI / Instant Digital Banking</option>
                  <option value="Cash on Delivery">Secured Courier Delivery Settlement (COD)</option>
                </select>
              </div>

              <button type="submit" id="submit-order-btn" class="btn btn-primary btn-block" style="padding: 14px; font-size: 1rem; margin-top: 12px;">
                <i class="fa-solid fa-lock"></i> Authorize Acquisition (${formatCurrency(total)})
              </button>
            </form>
          </div>

        </div>
      `;
    }

    function updateCartQty(productId, newQty) {
      if (newQty <= 0) {
        Cart.removeItem(productId);
      } else {
        Cart.updateQuantity(productId, newQty);
      }
      renderCart();
    }

    function removeCartItem(productId) {
      Cart.removeItem(productId);
      renderCart();
    }

    function handleClearCart() {
      if (confirm('Are you sure you want to clear your acquisition bag?')) {
        Cart.clear();
        renderCart();
      }
    }

    async function handlePlaceOrder(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-order-btn');
      const items = Cart.getItems();

      if (items.length === 0) {
        showToast('Your bag is empty.');
        return;
      }

      const customer_name = document.getElementById('cust-name').value.trim();
      const customer_email = document.getElementById('cust-email').value.trim();
      const shipping_address = document.getElementById('cust-address').value.trim();
      const payment_method = document.getElementById('cust-payment').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Authorization...';

      try {
        const orderData = {
          customer_name,
          customer_email,
          shipping_address,
          payment_method,
          items: items.map(i => ({
            id: i.id,
            name: i.name,
            price: i.price,
            quantity: i.quantity
          })),
          total_amount: Cart.getTotal()
        };

        const result = await apiRequest('/orders', {
          method: 'POST',
          body: JSON.stringify(orderData)
        });

        Cart.clear();
        showToast('Acquisition Authorized! Redirecting...');
        setTimeout(() => {
          window.location.href = 'orders.html?orderId=' + result.orderId;
        }, 800);

      } catch (err) {
        console.error('Order error:', err);
        showToast(err.message || 'Failed to place order');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Retry Authorization';
      }
    }

    renderCart();
  </script>
</body>
</html>
