<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart & Checkout - E-Commerce Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-bag-shopping"></i> E-COMMERCE <span>STORE</span>
        <span class="logo-tag">Full Stack</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li>
            <a href="cart.html" class="nav-link cart-icon-wrapper active">
              <i class="fa-solid fa-cart-shopping"></i> Cart
              <span id="cart-count" class="cart-badge" style="display: none;">0</span>
            </a>
          </li>
          <li id="nav-auth" class="nav-menu" style="gap: 16px;">
            <a href="login.html" class="nav-link"><i class="fa-solid fa-user"></i> Sign In</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Cart & Checkout Container -->
  <main class="container" style="margin-top: 32px; margin-bottom: 50px;">
    <h1 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 24px;">
      <i class="fa-solid fa-cart-shopping"></i> Shopping Cart & Checkout
    </h1>

    <div id="cart-view">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 CodeAlpha Full Stack Internship — Task 1: Simple E-Commerce Store</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    function renderCart() {
      const cartView = document.getElementById('cart-view');
      const items = Cart.getItems();
      const user = Auth.getUser();

      if (items.length === 0) {
        cartView.innerHTML = `
          <div class="empty-state" style="background: white; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 50px 20px;">
            <i class="fa-solid fa-cart-arrow-down empty-state-icon"></i>
            <h2>Your cart is currently empty</h2>
            <p>Browse our products and add items to your shopping cart.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">
              <i class="fa-solid fa-arrow-left"></i> Start Shopping
            </a>
          </div>
        `;
        return;
      }

      const subtotal = Cart.getTotal();
      const shipping = 0.00; // Free shipping
      const total = subtotal + shipping;

      cartView.innerHTML = `
        <div class="cart-layout">
          
          <!-- Items List Card -->
          <div class="cart-card">
            <h3 style="margin-bottom: 20px; font-size: 1.25rem;">Items in Your Cart (${Cart.getCount()})</h3>
            <table class="cart-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Quantity</th>
                  <th>Subtotal</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(item => `
                  <tr>
                    <td>
                      <div class="cart-item-info">
                        <img src="${item.image_url}" alt="${item.name}" class="cart-item-img" onerror="this.src='https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600'">
                        <div>
                          <a href="product.html?id=${item.id}" class="cart-item-title">${item.name}</a>
                          <div class="cart-item-price">${formatCurrency(item.price)} each</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <div style="display: flex; align-items: center; gap: 6px;">
                        <button class="qty-btn" style="width: 28px; height: 28px;" onclick="updateCartQty(${item.id}, ${item.quantity - 1})">-</button>
                        <span style="font-weight: 600; min-width: 24px; text-align: center;">${item.quantity}</span>
                        <button class="qty-btn" style="width: 28px; height: 28px;" onclick="updateCartQty(${item.id}, ${item.quantity + 1})">+</button>
                      </div>
                    </td>
                    <td style="font-weight: 700; color: var(--primary-color);">
                      ${formatCurrency(item.price * item.quantity)}
                    </td>
                    <td>
                      <button onclick="removeCartItem(${item.id})" class="btn btn-danger btn-sm" title="Remove item">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center;">
              <a href="index.html" class="btn btn-outline btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Continue Shopping
              </a>
              <button onclick="handleClearCart()" class="btn btn-outline btn-sm" style="color: var(--danger-color);">
                Clear Cart
              </button>
            </div>
          </div>

          <!-- Order Summary & Checkout Form -->
          <div class="cart-card">
            <h3 style="margin-bottom: 20px; font-size: 1.25rem;">Order Processing</h3>

            <div class="order-summary">
              <div class="summary-row">
                <span>Subtotal</span>
                <span>${formatCurrency(subtotal)}</span>
              </div>
              <div class="summary-row">
                <span>Shipping</span>
                <span style="color: var(--success-color); font-weight: 600;">FREE</span>
              </div>
              <div class="summary-row total">
                <span>Total Amount</span>
                <span>${formatCurrency(total)}</span>
              </div>
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">

            <h4 style="margin-bottom: 14px; font-size: 1.05rem;"><i class="fa-solid fa-truck"></i> Shipping & Payment</h4>
            <form id="checkout-form" onsubmit="handlePlaceOrder(event)">
              <div class="form-group">
                <label for="cust-name">Full Name *</label>
                <input type="text" id="cust-name" class="form-control" placeholder="John Doe" required value="${user ? user.name : ''}">
              </div>

              <div class="form-group">
                <label for="cust-email">Email Address *</label>
                <input type="email" id="cust-email" class="form-control" placeholder="john@example.com" required value="${user ? user.email : ''}">
              </div>

              <div class="form-group">
                <label for="cust-address">Delivery Address *</label>
                <textarea id="cust-address" class="form-control" rows="3" placeholder="Street address, City, State, ZIP code" required></textarea>
              </div>

              <div class="form-group">
                <label for="cust-payment">Payment Method *</label>
                <select id="cust-payment" class="form-control" required>
                  <option value="Credit / Debit Card">Credit / Debit Card</option>
                  <option value="Cash on Delivery">Cash on Delivery (COD)</option>
                  <option value="UPI / Net Banking">UPI / Net Banking</option>
                </select>
              </div>

              <button type="submit" id="submit-order-btn" class="btn btn-primary btn-block" style="padding: 14px; font-size: 1rem; margin-top: 10px;">
                <i class="fa-solid fa-lock"></i> Place Order (${formatCurrency(total)})
              </button>
            </form>
          </div>

        </div>
      `;
    }

    function updateCartQty(productId, newQty) {
      if (newQty <= 0) {
        Cart.removeItem(productId);
      } else {
        Cart.updateQuantity(productId, newQty);
      }
      renderCart();
    }

    function removeCartItem(productId) {
      Cart.removeItem(productId);
      renderCart();
    }

    function handleClearCart() {
      if (confirm('Are you sure you want to clear your cart?')) {
        Cart.clear();
        renderCart();
      }
    }

    async function handlePlaceOrder(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submit-order-btn');
      
      const items = Cart.getItems();
      if (items.length === 0) {
        showToast('Your cart is empty.');
        return;
      }

      const customer_name = document.getElementById('cust-name').value.trim();
      const customer_email = document.getElementById('cust-email').value.trim();
      const shipping_address = document.getElementById('cust-address').value.trim();
      const payment_method = document.getElementById('cust-payment').value;
      const total_amount = Cart.getTotal();

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing Order...';

      try {
        const orderData = {
          customer_name,
          customer_email,
          shipping_address,
          payment_method,
          items,
          total_amount
        };

        const result = await apiRequest('/orders', {
          method: 'POST',
          body: JSON.stringify(orderData)
        });

        // Clear cart
        Cart.clear();

        // Redirect to order confirmation receipt
        window.location.href = `orders.html?orderId=${result.orderId}`;
      } catch (err) {
        console.error('Order processing failed:', err);
        alert(`Error placing order: ${err.message}`);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Place Order';
      }
    }

    // Initial render
    renderCart();
  </script>
</body>
</html>
