<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | CodeAlpha E-Commerce Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon-wrap">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        CODEALPHA <span>COMMERCE</span>
        <span class="logo-badge">Platform</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-compass"></i> Catalog</a></li>
          <li>
            <a href="cart.html" class="nav-link cart-icon-wrapper">
              <i class="fa-solid fa-bag-shopping"></i> Cart
              <span id="cart-count" class="cart-badge" style="display: none;">0</span>
            </a>
          </li>
          <li id="nav-auth" class="nav-menu" style="gap: 12px;">
            <a href="login.html" class="nav-link"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Product Details Container -->
  <main class="container">
    <div style="margin-top: 28px;">
      <a href="index.html" class="btn btn-outline btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Return to Exhibition
      </a>
    </div>

    <div id="product-container">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin empty-state-icon" style="color: var(--cyan-primary);"></i>
        <p>Loading artifact specifications...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 <strong>CodeAlpha E-Commerce Platform</strong> &bull; Full Stack Internship &bull; Task 1</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    let currentProduct = null;

    async function loadProductDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      const container = document.getElementById('product-container');

      if (!productId) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-circle-question empty-state-icon"></i>
            <h3>No Artifact Selected</h3>
            <p>Please select an item from the main exhibition catalog.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 16px;">View Exhibition</a>
          </div>
        `;
        return;
      }

      try {
        const data = await apiRequest('/products/' + productId);
        currentProduct = data.product;

        document.title = currentProduct.name + ' | CodeAlpha E-Commerce Platform';

        container.innerHTML = `
          <div class="product-detail-container">
            <div class="product-detail-image-wrap">
              <img src="${currentProduct.image_url}" alt="${currentProduct.name}" class="product-detail-image" onerror="this.src='https://images.unsplash.com/photo-1545454675-3531b543be5d?w=800'">
            </div>
            
            <div class="product-detail-info">
              <span class="detail-category"><i class="fa-solid fa-shapes"></i> ${currentProduct.category}</span>
              <h1 class="detail-title">${currentProduct.name}</h1>
              
              <div class="detail-price">
                ${formatCurrency(currentProduct.price)}
                <span class="currency-note">Taxes & Certificate of Origin Included</span>
              </div>
              
              <p class="detail-description">${currentProduct.description}</p>
              
              <!-- Specs Grid -->
              <div class="specs-sheet">
                <div class="spec-box">
                  <span class="spec-label">Edition</span>
                  <span class="spec-val">Limited Collector's Batch</span>
                </div>
                <div class="spec-box">
                  <span class="spec-label">Availability</span>
                  <span class="spec-val" style="color: var(--emerald-success);"><i class="fa-solid fa-check"></i> ${currentProduct.stock} Available in Vault</span>
                </div>
                <div class="spec-box">
                  <span class="spec-label">Dispatch</span>
                  <span class="spec-val">Secured White-Glove Transit</span>
                </div>
                <div class="spec-box">
                  <span class="spec-label">Authenticity</span>
                  <span class="spec-val">Tamper-Proof Serial Token</span>
                </div>
              </div>

              <!-- Quantity Selector -->
              <div class="qty-control">
                <label for="qty-input">Quantity:</label>
                <button type="button" class="qty-btn" onclick="changeQty(-1)">-</button>
                <input type="number" id="qty-input" class="qty-input" value="1" min="1" max="${currentProduct.stock}" readonly>
                <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
              </div>

              <!-- Actions -->
              <div style="display: flex; gap: 14px; margin-top: 8px;">
                <button onclick="handleAddToCart()" class="btn btn-primary" style="flex: 1.3; padding: 14px;">
                  <i class="fa-solid fa-cart-plus"></i> Acquire / Add to Bag
                </button>
                <button onclick="handleBuyNow()" class="btn btn-secondary" style="flex: 1; padding: 14px;">
                  <i class="fa-solid fa-bolt"></i> Instant Checkout
                </button>
              </div>

              <!-- Trust row -->
              <div class="trust-badges-row">
                <div class="trust-badge"><i class="fa-solid fa-shield-check"></i> Verified Escrow</div>
                <div class="trust-badge"><i class="fa-solid fa-box-archive"></i> Museum-Grade Packaging</div>
                <div class="trust-badge"><i class="fa-solid fa-rotate-left"></i> 30-Day Studio Warranty</div>
              </div>

            </div>
          </div>
        `;
      } catch (err) {
        console.error('Error loading product details:', err);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation empty-state-icon" style="color: var(--rose-danger);"></i>
            <h3>Artifact Not Found</h3>
            <p>${err.message}</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 16px;">Return to Exhibition</a>
          </div>
        `;
      }
    }

    function changeQty(delta) {
      const input = document.getElementById('qty-input');
      if (!input || !currentProduct) return;
      let currentVal = parseInt(input.value) || 1;
      let newVal = currentVal + delta;
      if (newVal >= 1 && newVal <= (currentProduct.stock || 99)) {
        input.value = newVal;
      }
    }

    function handleAddToCart() {
      if (!currentProduct) return;
      const qty = parseInt(document.getElementById('qty-input').value) || 1;
      Cart.addItem(currentProduct, qty);
    }

    function handleBuyNow() {
      if (!currentProduct) return;
      const qty = parseInt(document.getElementById('qty-input').value) || 1;
      Cart.addItem(currentProduct, qty);
      window.location.href = 'cart.html';
    }

    loadProductDetails();
  </script>
</body>
</html>
