<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Sign In / Register - E-Commerce Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-bag-shopping"></i> E-COMMERCE <span>STORE</span>
        <span class="logo-tag">Full Stack</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li>
            <a href="cart.html" class="nav-link cart-icon-wrapper">
              <i class="fa-solid fa-cart-shopping"></i> Cart
              <span id="cart-count" class="cart-badge" style="display: none;">0</span>
            </a>
          </li>
          <li id="nav-auth" class="nav-menu" style="gap: 16px;">
            <a href="login.html" class="nav-link active"><i class="fa-solid fa-user"></i> Sign In</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Auth Card -->
  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
        </button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">
          <i class="fa-solid fa-user-plus"></i> Register
        </button>
      </div>

      <div class="auth-body">
        
        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
          <h2 style="font-size: 1.4rem; margin-bottom: 20px; text-align: center;">Welcome Back</h2>
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" id="login-btn" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 10px;">
            Sign In
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
          <h2 style="font-size: 1.4rem; margin-bottom: 20px; text-align: center;">Create New Account</h2>
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <button type="submit" id="reg-btn" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 10px;">
            Create Account
          </button>
        </form>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 CodeAlpha Full Stack Internship — Task 1: Simple E-Commerce Store</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    // If already logged in, redirect to home
    if (Auth.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');

      if (tab === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing In...';

      try {
        const res = await apiRequest('/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        Auth.setUser(res.token, res.user);
        showToast('Login successful!');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } catch (err) {
        alert(`Login failed: ${err.message}`);
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }

    async function handleRegister(event) {
      event.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('reg-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      try {
        const res = await apiRequest('/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password })
        });

        Auth.setUser(res.token, res.user);
        showToast('Registration successful! Welcome.');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } catch (err) {
        alert(`Registration failed: ${err.message}`);
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    }
  </script>
</body>
</html>
