<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - E-Commerce Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-bag-shopping"></i> E-COMMERCE <span>STORE</span>
        <span class="logo-tag">Full Stack</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
          <li>
            <a href="cart.html" class="nav-link cart-icon-wrapper">
              <i class="fa-solid fa-cart-shopping"></i> Cart
              <span id="cart-count" class="cart-badge" style="display: none;">0</span>
            </a>
          </li>
          <li id="nav-auth" class="nav-menu" style="gap: 16px;">
            <a href="login.html" class="nav-link"><i class="fa-solid fa-user"></i> Sign In</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Orders Content Area -->
  <main class="container" style="margin-top: 36px; margin-bottom: 50px;">
    <div id="orders-content">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin empty-state-icon"></i>
        <p>Loading order details...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 CodeAlpha Full Stack Internship — Task 1: Simple E-Commerce Store</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    async function loadOrdersView() {
      const container = document.getElementById('orders-content');
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId');

      // Case 1: Display Specific Order Confirmation / Invoice
      if (orderId) {
        try {
          const data = await apiRequest(`/orders/${orderId}`);
          const order = data.order;

          container.innerHTML = `
            <div class="order-success-card">
              <div class="success-icon">
                <i class="fa-solid fa-check"></i>
              </div>
              <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px;">Order Confirmed!</h1>
              <p style="color: var(--text-muted); margin-bottom: 24px;">
                Thank you for your purchase. We have received your order and are processing it.
              </p>

              <div class="order-receipt">
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                  <span>Order Reference: #${order.id}</span>
                  <span style="color: var(--primary-color);">${order.status}</span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; font-size: 0.9rem;">
                  <div>
                    <strong>Customer:</strong><br>
                    ${order.customer_name}<br>
                    <span style="color: var(--text-muted);">${order.customer_email}</span>
                  </div>
                  <div>
                    <strong>Delivery Address:</strong><br>
                    <span style="color: var(--text-muted);">${order.shipping_address}</span>
                  </div>
                  <div>
                    <strong>Payment Method:</strong><br>
                    <span style="color: var(--text-muted);">${order.payment_method}</span>
                  </div>
                  <div>
                    <strong>Placed On:</strong><br>
                    <span style="color: var(--text-muted);">${new Date(order.created_at).toLocaleString()}</span>
                  </div>
                </div>

                <h4 style="margin: 16px 0 8px; font-size: 0.95rem; border-top: 1px solid var(--border-color); padding-top: 12px;">Items Ordered:</h4>
                <ul style="list-style: none; margin-bottom: 16px;">
                  ${order.items.map(item => `
                    <li style="display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.9rem; border-bottom: 1px dashed var(--border-color);">
                      <span>${item.name} × <strong>${item.quantity}</strong></span>
                      <span>${formatCurrency(item.price * item.quantity)}</span>
                    </li>
                  `).join('')}
                </ul>

                <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 800; color: var(--text-dark); margin-top: 12px;">
                  <span>Total Paid:</span>
                  <span style="color: var(--primary-color);">${formatCurrency(order.total_amount)}</span>
                </div>
              </div>

              <div style="display: flex; gap: 14px; justify-content: center; margin-top: 24px;">
                <a href="index.html" class="btn btn-primary">
                  <i class="fa-solid fa-bag-shopping"></i> Continue Shopping
                </a>
                ${Auth.isLoggedIn() ? `
                  <a href="orders.html" class="btn btn-secondary">
                    <i class="fa-solid fa-list"></i> View All My Orders
                  </a>
                ` : ''}
              </div>
            </div>
          `;
        } catch (err) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fa-solid fa-triangle-exclamation empty-state-icon" style="color: var(--danger-color);"></i>
              <h3>Order Not Found</h3>
              <p>${err.message}</p>
              <a href="index.html" class="btn btn-primary" style="margin-top: 16px;">Go to Store</a>
            </div>
          `;
        }
        return;
      }

      // Case 2: Display User Order History
      if (!Auth.isLoggedIn()) {
        container.innerHTML = `
          <div class="empty-state" style="background: white; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 50px 20px;">
            <i class="fa-solid fa-lock empty-state-icon"></i>
            <h2>Sign in to view your orders</h2>
            <p>Please log in to your account to view your past order history.</p>
            <a href="login.html" class="btn btn-primary" style="margin-top: 16px;">Sign In / Register</a>
          </div>
        `;
        return;
      }

      try {
        const data = await apiRequest('/my-orders');
        const orders = data.orders || [];

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="background: white; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 50px 20px;">
              <i class="fa-solid fa-box-open empty-state-icon"></i>
              <h2>No Past Orders Found</h2>
              <p>You haven't placed any orders yet.</p>
              <a href="index.html" class="btn btn-primary" style="margin-top: 16px;">Start Shopping</a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <h1 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 24px;">
            <i class="fa-solid fa-clock-rotate-left"></i> My Order History (${orders.length})
          </h1>
          <div style="display: flex; flex-direction: column; gap: 20px;">
            ${orders.map(order => `
              <div class="cart-card">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 14px;">
                  <div>
                    <span style="font-weight: 700; font-size: 1.1rem;">Order #${order.id}</span>
                    <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 12px;">
                      ${new Date(order.created_at).toLocaleDateString()} at ${new Date(order.created_at).toLocaleTimeString()}
                    </span>
                  </div>
                  <span class="stock-badge" style="background: #e0f2fe; color: #0284c7; padding: 4px 10px; border-radius: 20px; font-weight: 600;">
                    ${order.status}
                  </span>
                </div>

                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                  <div>
                    <h5 style="margin-bottom: 8px; color: var(--text-muted);">Items:</h5>
                    <ul style="list-style: none;">
                      ${order.items.map(it => `
                        <li style="font-size: 0.95rem; margin-bottom: 4px;">
                          • ${it.name} (Qty: ${it.quantity}) — <strong>${formatCurrency(it.price * it.quantity)}</strong>
                        </li>
                      `).join('')}
                    </ul>
                  </div>
                  <div style="text-align: right; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                      <span style="color: var(--text-muted); font-size: 0.9rem;">Total Paid:</span>
                      <div style="font-size: 1.3rem; font-weight: 800; color: var(--primary-color);">
                        ${formatCurrency(order.total_amount)}
                      </div>
                    </div>
                    <div>
                      <a href="orders.html?orderId=${order.id}" class="btn btn-outline btn-sm">
                        <i class="fa-solid fa-receipt"></i> View Invoice
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation empty-state-icon" style="color: var(--danger-color);"></i>
            <h3>Failed to load orders</h3>
            <p>${err.message}</p>
          </div>
        `;
      }
    }

    loadOrdersView();
  </script>
</body>
</html>
