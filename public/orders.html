<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders & Tracking | CodeAlpha E-Commerce Platform</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon-wrap">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        CODEALPHA <span>COMMERCE</span>
        <span class="logo-badge">Platform</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link"><i class="fa-solid fa-compass"></i> Catalog</a></li>
          <li>
            <a href="cart.html" class="nav-link cart-icon-wrapper">
              <i class="fa-solid fa-bag-shopping"></i> Cart
              <span id="cart-count" class="cart-badge" style="display: none;">0</span>
            </a>
          </li>
          <li id="nav-auth" class="nav-menu" style="gap: 12px;">
            <a href="login.html" class="nav-link"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Content Container -->
  <main class="container" style="margin-top: 36px; margin-bottom: 60px;">
    <div id="orders-content">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin empty-state-icon" style="color: var(--cyan-primary);"></i>
        <p>Loading acquisition records...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 <strong>CodeAlpha E-Commerce Platform</strong> &bull; Full Stack Internship &bull; Task 1</p>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    async function loadOrdersView() {
      const container = document.getElementById('orders-content');
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('orderId');

      // Case 1: Specific Order Confirmation / Invoice
      if (orderId) {
        try {
          const data = await apiRequest('/orders/' + orderId);
          const order = data.order;

          container.innerHTML = `
            <div class="order-success-card">
              <div class="success-icon-wrap">
                <i class="fa-solid fa-check"></i>
              </div>
              <h1 style="font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 8px;">
                Acquisition Confirmed & Logged
              </h1>
              <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
                Order Reference: <strong style="color: var(--cyan-primary); font-family: var(--font-mono);">#CA-${order.id}</strong>
              </p>

              <!-- Visual 4-Stage Progress Timeline -->
              <div class="order-timeline">
                <div class="timeline-step completed">
                  <div class="step-node"><i class="fa-solid fa-check"></i></div>
                  <span class="step-label">Order Logged</span>
                </div>
                <div class="timeline-step active">
                  <div class="step-node"><i class="fa-solid fa-microscope"></i></div>
                  <span class="step-label">Studio QC</span>
                </div>
                <div class="timeline-step">
                  <div class="step-node"><i class="fa-solid fa-box"></i></div>
                  <span class="step-label">Sealed</span>
                </div>
                <div class="timeline-step">
                  <div class="step-node"><i class="fa-solid fa-plane"></i></div>
                  <span class="step-label">Dispatched</span>
                </div>
              </div>

              <!-- Order Summary Breakdown -->
              <div style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 24px; text-align: left; margin-bottom: 28px;">
                <h3 style="font-size: 1.1rem; color: #fff; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                  <i class="fa-solid fa-receipt" style="color: var(--cyan-primary);"></i> Acquired Items
                </h3>
                
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 18px;">
                  <thead>
                    <tr style="border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 0.8rem; font-family: var(--font-mono); text-transform: uppercase;">
                      <th style="padding: 8px 0; text-align: left;">Artifact</th>
                      <th style="padding: 8px 0; text-align: center;">Qty</th>
                      <th style="padding: 8px 0; text-align: right;">Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${order.items.map(item => `
                      <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 0.92rem;">
                        <td style="padding: 12px 0; color: #fff; font-weight: 500;">${escapeHtml(item.name)}</td>
                        <td style="padding: 12px 0; text-align: center; color: var(--text-muted); font-family: var(--font-mono);">${item.quantity}</td>
                        <td style="padding: 12px 0; text-align: right; color: #38bdf8; font-family: var(--font-mono); font-weight: 600;">${formatCurrency(item.price * item.quantity)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>

                <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; color: #fff; padding-top: 12px; border-top: 1px solid var(--border-subtle);">
                  <span>Verified Grand Total:</span>
                  <span style="color: #38bdf8; font-family: var(--font-mono);">${formatCurrency(order.total_amount)}</span>
                </div>
              </div>

              <!-- Dispatch Meta Information -->
              <div style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 20px; text-align: left; margin-bottom: 28px; font-size: 0.88rem;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                  <div>
                    <span style="color: var(--text-muted); display: block; font-size: 0.75rem; text-transform: uppercase; font-family: var(--font-mono);">Recipient</span>
                    <strong style="color: #fff;">${escapeHtml(order.customer_name)}</strong>
                  </div>
                  <div>
                    <span style="color: var(--text-muted); display: block; font-size: 0.75rem; text-transform: uppercase; font-family: var(--font-mono);">Contact Email</span>
                    <span style="color: #fff;">${escapeHtml(order.customer_email)}</span>
                  </div>
                  <div>
                    <span style="color: var(--text-muted); display: block; font-size: 0.75rem; text-transform: uppercase; font-family: var(--font-mono);">Delivery Destination</span>
                    <span style="color: #fff;">${escapeHtml(order.shipping_address)}</span>
                  </div>
                  <div>
                    <span style="color: var(--text-muted); display: block; font-size: 0.75rem; text-transform: uppercase; font-family: var(--font-mono);">Payment Method</span>
                    <span style="color: #fff;">${escapeHtml(order.payment_method)}</span>
                  </div>
                </div>
              </div>

              <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-primary">
                  <i class="fa-solid fa-compass"></i> Continue Exhibition
                </a>
                <button onclick="window.print()" class="btn btn-secondary">
                  <i class="fa-solid fa-print"></i> Print Authenticity Invoice
                </button>
              </div>
            </div>
          `;
        } catch (err) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fa-solid fa-triangle-exclamation empty-state-icon" style="color: var(--rose-danger);"></i>
              <h3>Acquisition Record Not Found</h3>
              <p>${err.message}</p>
              <a href="index.html" class="btn btn-primary" style="margin-top: 16px;">Return to Exhibition</a>
            </div>
          `;
        }
        return;
      }

      // Case 2: Logged-in User Order History
      if (Auth.isLoggedIn()) {
        try {
          const data = await apiRequest('/my-orders');
          const orders = data.orders || [];

          if (orders.length === 0) {
            container.innerHTML = `
              <div class="empty-state" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 60px 24px; box-shadow: var(--shadow-card);">
                <i class="fa-solid fa-box-archive empty-state-icon" style="color: var(--cyan-primary);"></i>
                <h2>No Past Acquisitions Found</h2>
                <p>You have not placed any orders yet. Visit our exhibition to acquire limited design pieces.</p>
                <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">
                  <i class="fa-solid fa-compass"></i> Explore Catalog
                </a>
              </div>
            `;
            return;
          }

          container.innerHTML = `
            <div class="section-header">
              <h2><i class="fa-solid fa-clock-rotate-left"></i> Acquisition <span>History</span></h2>
              <span class="count-pill">${orders.length} Order(s) Logged</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px;">
              ${orders.map(o => `
                <div class="cart-card" style="padding: 24px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                    <div>
                      <strong style="color: #fff; font-size: 1.1rem;">Order Reference #CA-${o.id}</strong>
                      <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 12px; font-family: var(--font-mono);">
                        ${new Date(o.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}
                      </span>
                    </div>
                    <span class="stock-badge" style="font-size: 0.82rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 4px 10px; border-radius: var(--radius-full);">
                      <i class="fa-solid fa-circle-dot"></i> ${o.status}
                    </span>
                  </div>

                  <div style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 16px;">
                    ${o.items.map(i => `<span>${escapeHtml(i.name)} (${i.quantity}x)</span>`).join(', ')}
                  </div>

                  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 10px;">
                    <div>
                      <span style="color: var(--text-muted); font-size: 0.85rem;">Total Settlement:</span>
                      <span style="font-family: var(--font-mono); font-weight: 700; color: #38bdf8; margin-left: 8px; font-size: 1.05rem;">
                        ${formatCurrency(o.total_amount)}
                      </span>
                    </div>
                    <a href="orders.html?orderId=${o.id}" class="btn btn-secondary btn-sm">
                      <i class="fa-solid fa-eye"></i> View Certificate / Invoice
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          `;

        } catch (err) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fa-solid fa-triangle-exclamation empty-state-icon" style="color: var(--rose-danger);"></i>
              <h3>Failed to Retrieve Order History</h3>
              <p>${err.message}</p>
            </div>
          `;
        }
        return;
      }

      // Case 3: Guest without orderId
      container.innerHTML = `
        <div class="empty-state" style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 60px 24px; box-shadow: var(--shadow-card);">
          <i class="fa-solid fa-user-lock empty-state-icon" style="color: var(--cyan-primary);"></i>
          <h2>Sign In to View Acquisition History</h2>
          <p>Sign in to your registered collector account to view past orders, track dispatch status, and download certificates of authenticity.</p>
          <div style="display: flex; gap: 14px; justify-content: center; margin-top: 24px;">
            <a href="login.html" class="btn btn-primary"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</a>
            <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-compass"></i> Explore Catalog</a>
          </div>
        </div>
      `;
    }

    loadOrdersView();
  </script>
</body>
</html>
